      summary: Add a new banner
      description: Create a new banner with priority management and multi-language support (Admin only). Maximum 10 banners allowed.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: Bearer token for authentication (e.g., "{headers : {Authorization : `Bearer ${token}`}")  
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - subtitle
                - priority
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Banner image
                title:
                  type: string
                  description: |
                    Banner title as JSON string with English & Hindi support.
                    Max length: 40 characters for English.
                    Example: `{"en": "English Title", "hi": "Hindi Title"}`
                subtitle:
                  type: string
                  description: |
                    Banner subtitle as JSON string with English & Hindi support.
                    Max length: 35 characters for English.
                    Example: `{"en": "English subtitle", "hi": "Hindi subtitle"}`
                priority:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: Priority number (1-10)
      responses:
        '201':
          description: Banner created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: Banner created successfully
                  banner:
                    type: object
                    properties:
                      id:
                        type: string
                      title:
                        type: object
                        properties:
                          en:
                            type: string
                          hi:
                            type: string
                      subtitle:
                        type: object
                        properties:
                          en:
                            type: string
                          hi:
                            type: string
                      priority:
                        type: integer
                      imageUrl:
                        type: object
                        properties:
                          url:
                            type: string
                            format: uri
                          public_id:
                            type: string
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '400':
          description: |
            Bad request - Possible reasons:
            - Required fields missing
            - Image is required
            - Priority number out of range (1-10)
            - Title too long (max 40 characters for English)
            - Subtitle too long (max 35 characters for English)
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - Admin access required
        '409':
          description: Conflict - Maximum banner limit (10) exceeded
        '500':
          description: Internal server error  

