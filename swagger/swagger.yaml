openapi: 3.0.0
info:
  title: Chari-fund API
  version: 1.0.0
  description: API documentation for charifund project.
servers: 
  - url: https://charifund-backend.onrender.com
    description: Deployed Server
  - url: http://localhost:7000
    description: Local server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:            

  /api/V1/admin/category/create-category:
    post:
      tags:
        - Category
      summary: Create a new category
      description: Create a new category with multi-language support (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: Bearer token for authentication (e.g., "{headers : {Authorization : `Bearer ${token}`}")  
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: object
                  required:
                    - en
                    - hi
                  properties:
                    en:
                      type: string
                      description: Category name in English
                    hi:
                      type: string
                      description: Category name in Hindi
                  description: Category name with English & Hindi support
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: Category created successfully
                  category:
                    type: object
                    properties:
                      en:
                        type: string
                        example: Education
                      hi:
                        type: string
                        example: शिक्षा
        '400':
          description: Category name is required
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - Admin access required
        '409':
          description: Conflict - Category already exists (either in English or Hindi)
        '500':
          description: Internal server error 

  /api/V1/admin/category/update-category/{categoryId}:
    put:
      tags:
        - Category
      summary: Update a category
      description: Update an existing category by ID with multi-language support (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: Bearer token for authentication (e.g., "{headers : {Authorization : `Bearer ${token}`}")
        - in: path
          name: categoryId
          required: true
          schema:
            type: string
          description: The ID of the category to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: object
                  required:
                    - en
                    - hi
                  properties:
                    en:
                      type: string
                      description: Category name in English
                    hi:
                      type: string
                      description: Category name in Hindi
                  description: Category name with English & Hindi support
      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: Category Updated Successfully
                  category:
                    type: object
                    properties:
                      en:
                        type: string
                        example: Updated Education
                      hi:
                        type: string
                        example: अद्यतन शिक्षा
        '400':
          description: Category name is required
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Category not found
        '409':
          description: Conflict - Category name already exists (either in English or Hindi)
        '500':
          description: Internal server error

  /api/V1/admin/category/get-category:
    get:
      tags:
        - Category
      summary: Get all categories
      description: Retrieve all categories with multi-language support. Supports both paginated and non-paginated responses with filtering (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: Bearer token for authentication (e.g., "{headers : {Authorization : `Bearer ${token}`}")
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination (only used when limit is provided)
        - in: query
          name: limit
          schema:
            type: integer
          description: Number of categories per page (if not provided, returns all categories without pagination)
        - in: query
          name: name
          schema:
            type: string
          description: Filter categories by name
        - in: header
          name: Accept-Language
          schema:
            type: string
            enum: [en, hi]
            default: en
          description: Language preference for response (en - English, hi - Hindi)
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      total:
                        type: integer
                        example: 25
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 10
                      totalPages:
                        type: integer
                        example: 3
                      category:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                              description: Category name in requested language
                            createdAt:
                              type: string
                              format: date-time
                    description: Paginated response when limit is provided
                  - type: object
                    properties:
                      total:
                        type: integer
                        example: 25
                      category:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: object
                              properties:
                                en:
                                  type: string
                                hi:
                                  type: string
                            createdAt:
                              type: string
                              format: date-time
                    description: Non-paginated response when limit is not provided
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - Admin access required
        '500':
          description: Internal server error

  /api/V1/admin/category/delete-category/{categoryId}:
    delete:
      tags:
        - Category
      summary: Delete a category
      description: Delete a category by ID (Admin only). Category cannot be deleted if it has associated campaigns or blogs.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: Bearer token for authentication (e.g., "{headers : {Authorization : `Bearer ${token}`}")
        - in: path
          name: categoryId
          required: true
          schema:
            type: string
          description: The ID of the category to delete
      responses:
        '200':
          description: Category deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: Category deleted successfully
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Category not found
        '409':
          description: Conflict - Cannot delete category with associated campaigns
        '500':
          description: Internal server error   

  /api/V1/admin/getCategoryById/{categoryId}:
    get:
      tags:
        - Category
      summary: Get category by ID
      description: Retrieves a specific category by its ID (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: Bearer token for authentication (e.g., "{headers : {Authorization : `Bearer ${token}`}")
        - in: path
          name: categoryId
          required: true
          schema:
            type: string
          description: The ID of the category to retrieve
      responses:
        '200':
          description: Category retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: object
                    properties:
                      en:
                        type: string
                      hi:
                        type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Category not found
        '500':
          description: Internal server error                                    

  /api/V1/admin/campaign/add-campaign:
    post:
      tags:
        - Campaign
      summary: Add a new campaign
      description: Create a new campaign with multiple images and multi-language support (English & Hindi) (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: Bearer token for authentication (e.g., "{headers : {Authorization : `Bearer ${token}`}")  
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - category
                - description
                - goalAmount
                - summary
                - keyPoints
                - location
                - images
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Campaign images (at least one required)
                title:
                  type: string
                  description: |
                    Campaign title as JSON string with English & Hindi support.
                    Example: `{"en": "English Title", "hi": "Hindi Title"}`
                category:
                  type: string
                  description: Campaign category name
                description:
                  type: string
                  description: |
                    Campaign description as JSON string with English & Hindi support.
                    Example: `{"en": "English description", "hi": "Hindi description"}`
                goalAmount:
                  type: number
                  description: Fundraising goal amount
                summary:
                  type: string
                  description: |
                    Campaign summary as JSON string with English & Hindi support.
                    Example: `{"en": "English summary", "hi": "Hindi summary"}`
                keyPoints:
                  type: string
                  description: |
                    JSON string array with English & Hindi support for key points.
                    Example: `[{"en": "Point 1", "hi": "Point 1 Hindi"}, {"en": "Point 2", "hi": "Point 2 Hindi"}]`
                location:
                  type: string
                  description: Campaign location
      responses:
        '201':
          description: Campaign created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: Campaign created successfully
                  campaign:
                    type: object
                    properties:
                      id:
                        type: string
                      title:
                        type: object
                        properties:
                          en:
                            type: string
                          hi:
                            type: string
                      description:
                        type: object
                        properties:
                          en:
                            type: string
                          hi:
                            type: string
                      summary:
                        type: object
                        properties:
                          en:
                            type: string
                          hi:
                            type: string
                      keyPoints:
                        type: array
                        items:
                          type: object
                          properties:
                            en:
                              type: string
                            hi:
                              type: string
                      imageUrl:
                        type: object
                        properties:
                          images:
                            type: array
                            items:
                              type: object
                              properties:
                                url:
                                  type: string
                                  format: uri
                                public_id:
                                  type: string
                      goalAmount:
                        type: number
                      status:
                        type: string
                      location:
                        type: string
                      categoryId:
                        type: string
                      category:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '400':
          description: |
            Bad request - Possible reasons:
            - Required fields missing
            - Images are required
            - Key points array is empty
            - Invalid JSON format for multi-language fields
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Category not found
        '500':
          description: Internal server error               

  /api/V1/admin/campaign/getAllCampaigns:
    get:
      tags:
        - Campaign
      summary: Get all campaigns with pagination and filtering
      description: Retrieves paginated list of all campaigns with donation progress information, multi-language support, and filtering functionality.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: Bearer token for authentication (e.g., "{headers : {Authorization : `Bearer ${token}`}")
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of campaigns per page
        - in: query
          name: title
          schema:
            type: string
          description: Filter campaigns by title
        - in: query
          name: category
          schema:
            type: string
          description: Filter campaigns by category name
        - in: query
          name: status
          schema:
            type: string
            enum: [active, completed, inactive]
          description: Filter campaigns by status
        - in: header
          name: Accept-Language
          schema:
            type: string
            enum: [en, hi]
            default: en
          description: Language preference for response (en - English, hi - Hindi)
      responses:
        '200':
          description: Campaigns retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 25
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 10
                  totalPages:
                    type: integer
                    example: 3
                  campaigns:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                          description: Title in requested language
                        category:
                          type: string
                          description: Category name in requested language
                        description:
                          type: string
                          description: Description in requested language
                        images:
                          type: array
                          items:
                            type: string
                            format: uri
                        goalAmount:
                          type: number
                        raisedAmount:
                          type: number
                        donationPercentage:
                          type: integer
                          minimum: 0
                          maximum: 100
                          description: Donation progress percentage
                        location:
                          type: string
                          description: Location in requested language
                        status:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - Admin access required
        '500':
          description: Internal server error        

  /api/V1/admin/getCampaignById/{campaignId}:
    get:
      tags:
        - Campaign
      summary: Get campaign by ID
      description: Retrieves a specific campaign by its ID with full multi-language data (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: Bearer token for authentication (e.g., "{headers : {Authorization : `Bearer ${token}`}")
        - in: path
          name: campaignId
          required: true
          schema:
            type: string
          description: The ID of the campaign to retrieve
      responses:
        '200':
          description: Campaign retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: object
                    properties:
                      en:
                        type: string
                      hi:
                        type: string
                  category:
                    type: string
                  description:
                    type: object
                    properties:
                      en:
                        type: string
                      hi:
                        type: string
                  summary:
                    type: object
                    properties:
                      en:
                        type: string
                      hi:
                        type: string
                  keyPoints:
                    type: array
                    items:
                      type: object
                      properties:
                        en:
                          type: string
                        hi:
                          type: string
                  images:
                    type: array
                    items:
                      type: string
                      format: uri
                  goalAmount:
                    type: number
                  raisedAmount:
                    type: number
                  donationPercentage:
                    type: integer
                    minimum: 0
                    maximum: 100
                    description: Donation progress percentage
                  location:
                    type: object
                    properties:
                      en:
                        type: string
                      hi:
                        type: string
                  status:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
        '400':
          description: Campaign ID is required
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Campaign not found
        '500':
          description: Internal server error        

  /api/V1/admin/campaign/update-campaign/{campaignId}:
    put:
      tags:
        - Campaign
      summary: Update campaign
      description: Update an existing campaign by ID with multi-language support and image management (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: Bearer token for authentication (e.g., "{headers : {Authorization : `Bearer ${token}`}")
        - in: path
          name: campaignId
          required: true
          schema:
            type: string
          description: The ID of the campaign to update
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: New campaign images to upload
                existingImages:
                  type: array
                  items:
                    type: string
                    format: uri
                  description: Array of existing image URLs to keep
                title:
                  type: string
                  description: |
                    Campaign title as JSON string with English & Hindi support.
                    Example: `{"en": "English Title", "hi": "Hindi Title"}`
                category:
                  type: string
                  description: Campaign category name
                description:
                  type: string
                  description: |
                    Campaign description as JSON string with English & Hindi support.
                    Example: `{"en": "English description", "hi": "Hindi description"}`
                goalAmount:
                  type: number
                  description: Fundraising goal amount
                summary:
                  type: string
                  description: |
                    Campaign summary as JSON string with English & Hindi support.
                    Example: `{"en": "English summary", "hi": "Hindi summary"}`
                keyPoints:
                  type: string
                  description: |
                    JSON string array with English & Hindi support for key points.
                    Example: `[{"en": "Point 1", "hi": "Point 1 Hindi"}, {"en": "Point 2", "hi": "Point 2 Hindi"}]`
                location:
                  type: string
                  description: Campaign location
                status:
                  type: string
                  description: Campaign status
      responses:
        '200':
          description: Campaign updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: Campaign updated successfully
        '400':
          description: Campaign ID is required or invalid input
        '401':
          description: Unauthorized - Authentication required
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Campaign not found or category does not exist
        '500':
          description: Internal server error 

  /api/V1/admin/campaign/delete-campaign/{campaignId}:
    delete:
      tags:
        - Campaign
      summary: Delete a campaign (Admin only)
      description: |
        Deletes a campaign permanently.
        Requires admin privileges.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: Bearer token for authentication (e.g., "{headers : {Authorization : `Bearer ${token}`}")
        - in: path
          name: campaignId
          required: true
          schema:
            type: string
          description: ID of the campaign to delete
      responses:
        '200':
          description: Campaign deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: "Campaign deleted successfully"
        '400':
          description: Campaign ID is required
          content:
            application/json:
              schema:
                type: string
                example: "Campaign ID is required"
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                type: string
                example: "Campaign not found"
        '500':
          description: Internal server error                     

  /api/V1/admin/comment/getCommentById/{commentId}:
    get:
      tags:
        - Comment
      summary: Get comment by ID (Admin only)
      description: |
        Retrieves a specific comment by its ID. Requires admin privileges.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: Bearer token for authentication (e.g., "{headers : {Authorization : `Bearer ${token}`}")
        - in: path
          name: commentId
          required: true
          schema:
            type: string
          description: ID of the comment to retrieve
      responses:
        '200':
          description: Comment retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
                  comment:
                    type: string
                  likeCount:
                    type: integer
                  status:
                    type: string
                  campaignId:
                    type: string
                    nullable: true
                  blogId:
                    type: string
                    nullable: true
                  parentCommentId:
                    type: string
                    nullable: true
                  createdAt:
                    type: string
                    format: date-time
        '404':
          description: Comment not found
          content:
            application/json:
              schema:
                type: string
                example: "Comment not exists"
        '401':
          description: Unauthorized - Admin privileges required
        '500':
          description: Internal server error        

  /api/V1/admin/comment/getAllComments:
    get:
      tags:
        - Comment
      summary: Get all comments for admin
      description: |
        Retrieves a paginated list of all comments (Admin Only).
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: Bearer token for authentication (e.g., "{headers : {Authorization : `Bearer ${token}`}")
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of comments per page
        - in: query
          name: status
          schema:
            type: string
          description: Filter comments by status (e.g., "APPROVED", "PENDING", "REJECTED")
      responses:
        '200':
          description: Comments retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 50
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 10
                  totalPages:
                    type: integer
                    example: 5
                  comments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        email:
                          type: string
                        comment:
                          type: string
                        likeCount:
                          type: integer
                        status:
                          type: string
                        campaignId:
                          type: string
                          nullable: true
                        blogId:
                          type: string
                          nullable: true
                        parentCommentId:
                          type: string
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                        campaign:
                          type: object
                          nullable: true
                          properties:
                            id:
                              type: string
                            title:
                              type: string
                        blog:
                          type: object
                          nullable: true
                          properties:
                            id:
                              type: string
                            title:
                              type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - not an admin
        '500':
          description: Internal server error          

  /api/V1/admin/comment/moderate-comment/{commentId}:
    put:
      tags:
        - Comment
      summary: Moderate a comment (Admin only)
      description: |
        Approves or rejects a comment. Requires admin privileges.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: Bearer token for authentication (e.g., "{headers : {Authorization : `Bearer ${token}`}")
        - in: path
          name: commentId
          required: true
          schema:
            type: string
          description: ID of the comment to moderate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - approved
              properties:
                approved:
                  type: boolean
                  description: Whether to approve the comment
      responses:
        '200':
          description: Comment moderated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: "Message approved"
        '400':
          description: Invalid approval status
          content:
            application/json:
              schema:
                type: string
                example: "Invalid approval status"
        '404':
          description: Comment not found
          content:
            application/json:
              schema:
                type: string
                example: "Comment not exists"
        '401':
          description: Unauthorized - Admin privileges required
